<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e222b"/>
      <stop offset="100%" stop-color="#0f1115"/>
    </linearGradient>
    <linearGradient id="boardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="studGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="50%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)"/>
  <rect x="6" y="6" width="500" height="500" rx="104" fill="none" stroke="#fbbf24" stroke-opacity="0.25" stroke-width="4"/>

  <!-- Steel Studs / Perfiles Montantes (Background Structure) -->
  <g opacity="0.6">
    <rect x="140" y="80" width="36" height="352" rx="4" fill="url(#studGrad)"/>
    <rect x="238" y="80" width="36" height="352" rx="4" fill="url(#studGrad)"/>
    <rect x="336" y="80" width="36" height="352" rx="4" fill="url(#studGrad)"/>
    <!-- Top & Bottom Soleras -->
    <rect x="100" y="80" width="312" height="28" rx="4" fill="url(#studGrad)"/>
    <rect x="100" y="404" width="312" height="28" rx="4" fill="url(#studGrad)"/>
  </g>

  <!-- Front Durlock Board (Partially installed sheet) -->
  <g filter="drop-shadow(0 12px 24px rgba(0,0,0,0.5))">
    <path d="M 120 120 L 360 120 L 360 392 L 120 392 Z" fill="url(#boardGrad)" rx="8"/>
    <!-- Gypsum Core side edge -->
    <path d="M 360 120 L 382 138 L 382 410 L 360 392 Z" fill="#94a3b8"/>
    <path d="M 120 392 L 142 410 L 382 410 L 360 392 Z" fill="#64748b"/>
    
    <!-- Screw dots on plate -->
    <circle cx="160" cy="150" r="5" fill="#475569"/>
    <circle cx="160" cy="220" r="5" fill="#475569"/>
    <circle cx="160" cy="290" r="5" fill="#475569"/>
    <circle cx="160" cy="360" r="5" fill="#475569"/>
    
    <circle cx="256" cy="150" r="5" fill="#475569"/>
    <circle cx="256" cy="220" r="5" fill="#475569"/>
    <circle cx="256" cy="290" r="5" fill="#475569"/>
    <circle cx="256" cy="360" r="5" fill="#475569"/>
    
    <circle cx="340" cy="150" r="5" fill="#475569"/>
    <circle cx="340" cy="220" r="5" fill="#475569"/>
    <circle cx="340" cy="290" r="5" fill="#475569"/>
    <circle cx="340" cy="360" r="5" fill="#475569"/>
  </g>

  <!-- Level / Tool Accent -->
  <g transform="translate(140, 310) rotate(-18)">
    <rect x="0" y="0" width="260" height="42" rx="8" fill="url(#goldGrad)" stroke="#b45309" stroke-width="3"/>
    <!-- Level Vials -->
    <rect x="40" y="11" width="36" height="20" rx="6" fill="#1e293b"/>
    <circle cx="58" cy="21" r="5" fill="#84cc16"/>
    <rect x="112" y="11" width="36" height="20" rx="6" fill="#1e293b"/>
    <circle cx="130" cy="21" r="5" fill="#84cc16"/>
    <rect x="184" y="11" width="36" height="20" rx="6" fill="#1e293b"/>
    <circle cx="202" cy="21" r="5" fill="#84cc16"/>
  </g>
</svg>
